services:

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    env_file:
      - ./user-service/.env

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8082:8082"
    env_file:
      - ./product-service/.env

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8083:8083"
    env_file:
      - ./order-service/.env